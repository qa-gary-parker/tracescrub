name: tracescrub
description: Find or redact secrets in Playwright traces, HTML reports, HAR files and storageState before uploading them as artifacts.
author: Gary Parker
branding:
  icon: shield
  color: gray-dark

inputs:
  paths:
    description: Files or directories to scan, separated by spaces or newlines (for example "test-results playwright-report"). Missing paths are skipped.
    required: true
  mode:
    description: "check (report and fail on findings) or scrub (redact in place)."
    required: false
    default: check
  env-names:
    description: Comma-separated names of environment variables whose values are secrets (for example "TEST_PASSWORD,API_TOKEN"). The variables must be set in the job or step env.
    required: false
    default: ''
  env-file:
    description: Optional dotenv file whose values are secrets.
    required: false
    default: ''
  config:
    description: Optional path to a tracescrub.config.json file.
    required: false
    default: ''
  fail-on-findings:
    description: In check mode, fail the step when secrets are found. Ignored in scrub mode.
    required: false
    default: 'true'

outputs:
  findings:
    description: Number of secrets found (check) or redacted (scrub).
    value: ${{ steps.run.outputs.findings }}
  exit-code:
    description: Raw exit code of the tracescrub CLI (0 clean, 1 findings, 2 usage error).
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Build tracescrub
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ ! -f dist/cli.js ]; then
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          npm run build --silent
        fi

    - name: Run tracescrub
      id: run
      shell: bash
      env:
        TS_CLI: ${{ github.action_path }}/dist/cli.js
        TS_PATHS: ${{ inputs.paths }}
        TS_MODE: ${{ inputs.mode }}
        TS_ENV_NAMES: ${{ inputs.env-names }}
        TS_ENV_FILE: ${{ inputs.env-file }}
        TS_CONFIG: ${{ inputs.config }}
        TS_FAIL: ${{ inputs.fail-on-findings }}
      run: |
        set -uo pipefail
        report="${RUNNER_TEMP:-/tmp}/tracescrub-report.json"

        args=()
        case "$TS_MODE" in
          check) args+=(check) ;;
          scrub) args+=(scrub --in-place) ;;
          *) echo "::error title=tracescrub::mode must be 'check' or 'scrub', got '$TS_MODE'"; exit 2 ;;
        esac

        found=0
        read -r -d '' -a candidates <<< "$TS_PATHS" || true
        for p in "${candidates[@]}"; do
          if [ -e "$p" ]; then args+=("$p"); found=1; else echo "tracescrub: skipping missing path $p"; fi
        done
        if [ "$found" = 0 ]; then
          echo "tracescrub: none of the paths exist; nothing to do"
          echo "findings=0" >> "$GITHUB_OUTPUT"
          echo "exit-code=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        [ -n "$TS_ENV_NAMES" ] && args+=(--env "$TS_ENV_NAMES")
        [ -n "$TS_ENV_FILE" ] && args+=(--env-file "$TS_ENV_FILE")
        [ -n "$TS_CONFIG" ] && args+=(--config "$TS_CONFIG")
        args+=(--json-out "$report")

        node "$TS_CLI" "${args[@]}"
        code=$?

        findings=0
        if [ -f "$report" ]; then
          findings=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).summary.findings)' "$report")
        fi
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        if [ "$code" -ge 2 ]; then
          echo "::error title=tracescrub::tracescrub failed with exit code $code"
          exit "$code"
        fi
        if [ "$TS_MODE" = scrub ]; then
          echo "### tracescrub: redacted $findings secret(s)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$code" = 1 ]; then
          echo "### tracescrub: found $findings potential secret(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TS_FAIL" = true ]; then
            echo "::error title=tracescrub::found $findings potential secret(s) in test artifacts. Run with mode: scrub before uploading them."
            exit 1
          fi
          echo "::warning title=tracescrub::found $findings potential secret(s) in test artifacts"
          exit 0
        fi
        echo "### tracescrub: no secrets found" >> "$GITHUB_STEP_SUMMARY"
